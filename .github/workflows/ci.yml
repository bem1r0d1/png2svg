name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all
      - name: WASM build
        run: cargo build -p png2svg-wasm --target wasm32-unknown-unknown --release
      - name: Quality regression (corpus)
        run: cargo run --release -p png2svg-metrics --bin bench -- --check
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: report/
