[package]
name = "png2svg-wasm"
description = "WebAssembly bindings for png2svg-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
png2svg-core = { path = "../core", features = ["serde"] }
serde_json = "1"
wasm-bindgen = "0.2"
