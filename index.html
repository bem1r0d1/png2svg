<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>png2svg</title>
<style>:root {
  --bg: var(--figma-color-bg, #ffffff);
  --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
  --text: var(--figma-color-text, #1e1e1e);
  --muted: var(--figma-color-text-secondary, #757575);
  --border: var(--figma-color-border, #e6e6e6);
  --brand: var(--figma-color-bg-brand, #0d99ff);
  --on-brand: var(--figma-color-text-onbrand, #ffffff);
  --danger: var(--figma-color-text-danger, #dc3412);
  --check-a: var(--figma-color-bg-tertiary, #e9e9e9);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 11px/16px Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text);
  background: var(--bg);
}
main { display: flex; flex-direction: column; height: 100%; }
header {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--border);
}
.source { min-width: 0; display: flex; flex-direction: column; }
#source-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.muted { color: var(--muted); }

.seg { display: inline-flex; background: var(--bg-2); border-radius: 6px; padding: 2px; gap: 2px; }
.seg button {
  border: 0; background: transparent; color: var(--muted); font: inherit;
  padding: 3px 8px; border-radius: 4px; cursor: pointer;
}
.seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--border); }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; }

.preview {
  position: relative; flex: 1 1 auto; min-height: 220px; margin: 8px 12px 0;
  border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  background: repeating-conic-gradient(var(--check-a) 0 25%, var(--bg) 0 50%) 0 0 / 14px 14px;
}
.stage { position: absolute; inset: 8px; }
.stage img, .stage #img-vector {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
}
#img-vector svg { width: 100%; height: 100%; display: block; }
.preview.empty .stage { display: none; }
.preview:not(.empty) .placeholder { display: none; }
.placeholder {
  position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px;
  align-items: center; justify-content: center; text-align: center; padding: 16px; color: var(--muted);
  background: var(--bg);
}
.preview.dragover { outline: 2px dashed var(--brand); outline-offset: -4px; }
#split-handle {
  position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--brand); cursor: ew-resize;
}
#split-handle::after {
  content: ""; position: absolute; top: 50%; left: -6px; width: 14px; height: 14px; margin-top: -7px;
  border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px var(--bg);
}
.busy { position: absolute; top: 8px; right: 8px; }
.spinner {
  display: block; width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--border); border-top-color: var(--brand); animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.stats { padding: 6px 12px 0; color: var(--muted); min-height: 22px; }
.palette { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 12px 0; min-height: 20px; }
.chip {
  width: 16px; height: 16px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);
}

.controls { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); margin-top: 8px; }
.row { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 8px; }
.row > label { color: var(--muted); }
.row.toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; padding-top: 2px; }
.value { min-width: 34px; text-align: right; }
.inline { display: flex; align-items: center; gap: 6px; }
input[type=range] { width: 100%; accent-color: var(--brand); }
input[type=number] {
  width: 56px; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px;
}
input[type=checkbox] { accent-color: var(--brand); margin: 0 4px 0 0; vertical-align: middle; }
label.check { color: var(--text); cursor: pointer; }

footer {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 12px; border-top: 1px solid var(--border);
}
#message { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#message.error { color: var(--danger); }
.actions { display: flex; gap: 8px; }
.button {
  display: inline-block; font: inherit; font-weight: 500; border-radius: 6px; padding: 5px 12px;
  cursor: pointer; border: 1px solid transparent;
}
.button.primary { background: var(--brand); color: var(--on-brand); }
.button.secondary { background: transparent; color: var(--text); border-color: var(--border); }
.button:disabled { opacity: .4; cursor: default; }

/* ---- web version (outside Figma) ---- */
.topbar { display: none; }
body.web { background: var(--bg-2); height: auto; min-height: 100%; }
body.web .topbar {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  max-width: 960px; margin: 0 auto; padding: 16px 16px 8px; font-size: 13px;
}
body.web .topbar strong { font-size: 16px; }
body.web .topbar .links { margin-left: auto; display: flex; gap: 14px; }
body.web .topbar a { color: var(--brand); text-decoration: none; }
body.web main {
  max-width: 960px; margin: 0 auto 24px; height: auto; background: var(--bg);
  border: 1px solid var(--border); border-radius: 10px; font-size: 12px;
}
body.web .preview { min-height: min(62vh, 560px); }
@media (prefers-color-scheme: dark) {
  body.web { --bg: #1e1e1e; --bg-2: #141414; --text: #eeeeee; --muted: #a0a0a0; --border: #333333; --check-a: #2a2a2a; }
}
</style>
</head>
<body>
<div class="topbar">
  <strong>png2svg</strong>
  <span class="muted">PNG → SVG без шума, пикселей и ступенек</span>
  <span class="links">
    <a href="png2svg-figma-plugin.zip">Figma-плагин</a>
    <a href="report/">Качество</a>
    <a href="https://github.com/bem1r0d1/png2svg">GitHub</a>
  </span>
</div>
<main>
  <header>
    <div class="source">
      <span id="source-name">Нет изображения</span>
      <span id="source-size" class="muted"></span>
    </div>
    <div class="seg" role="tablist" id="view-mode">
      <button data-view="original">Оригинал</button>
      <button data-view="split" class="on">Сравнить</button>
      <button data-view="vector">Вектор</button>
    </div>
  </header>

  <section id="preview" class="preview empty">
    <div class="stage" id="stage">
      <img id="img-original" alt="">
      <div id="img-vector"></div>
      <div id="split-handle" hidden></div>
    </div>
    <div class="placeholder" id="placeholder">
      <p id="placeholder-text">Выделите слой с изображением или перетащите PNG сюда</p>
      <label class="button secondary">Выбрать файл<input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden></label>
    </div>
    <div class="busy" id="busy" hidden><span class="spinner"></span></div>
  </section>

  <div class="stats" id="stats"></div>
  <div class="stats" id="detected"></div>
  <div class="palette" id="palette"></div>

  <section class="controls">
    <div class="row">
      <label>Пресет</label>
      <div class="seg wide" id="preset">
        <button data-preset="auto" class="on">Авто</button>
        <button data-preset="logo">Логотип</button>
        <button data-preset="icon">Иконка</button>
        <button data-preset="illustration">Иллюстрация</button>
      </div>
    </div>
    <div class="row">
      <label for="colors">Цвета</label>
      <div class="inline">
        <input type="checkbox" id="colors-auto" checked><label for="colors-auto" class="check">авто</label>
        <input type="number" id="colors" min="1" max="64" value="8" disabled>
      </div>
    </div>
    <div class="row">
      <label for="detail">Детализация</label>
      <input type="range" id="detail" min="0" max="1" step="0.05" value="0.5">
    </div>
    <div class="row">
      <label for="smoothness">Гладкость</label>
      <input type="range" id="smoothness" min="0" max="1" step="0.05" value="0.5">
    </div>
    <div class="row">
      <label for="corner">Углы</label>
      <input type="range" id="corner" min="20" max="120" step="5" value="60" title="Порог угла: меньше — больше острых углов">
    </div>
    <div class="row">
      <label for="smoothing">Сглаживание</label>
      <div class="inline">
        <input type="range" id="smoothing" min="-0.1" max="3" step="0.1" value="-0.1" title="Сглаживание краёв (px): убирает ступеньки, шум и пикселизацию. Крайнее левое — авто">
        <span id="smoothing-value" class="muted value">авто</span>
      </div>
    </div>
    <div class="row">
      <label for="speckle">Мин. площадь</label>
      <div class="inline">
        <input type="range" id="speckle" min="0" max="100" step="1" value="0" title="Области меньше этой площади (px²) вливаются в соседние; 0 — авто">
        <span id="speckle-value" class="muted value">авто</span>
      </div>
    </div>
    <div class="row toggles">
      <span><input type="checkbox" id="shapes" checked><label for="shapes" class="check" title="Круги, эллипсы и прямоугольники становятся родными фигурами Figma">Фигуры</label></span>
      <span><input type="checkbox" id="separate" checked><label for="separate" class="check" title="Каждая фигура — отдельный слой (иначе один слой на цвет)">Раздельно</label></span>
      <span><input type="checkbox" id="snap" checked><label for="snap" class="check">Оси</label></span>
      <span><input type="checkbox" id="denoise" checked><label for="denoise" class="check" title="Убирать шум и артефакты JPEG">Шум</label></span>
      <span><input type="checkbox" id="depixelate" checked><label for="depixelate" class="check" title="Восстанавливать гладкие формы из пиксельных (увеличенных) картинок">Пиксели</label></span>
      <span><input type="checkbox" id="match" checked><label for="match" class="check" title="Подогнать цвета к стилям и переменным документа и привязать их">Стили</label></span>
    </div>
  </section>

  <footer>
    <span id="message" class="muted"></span>
    <div class="actions">
      <button class="button secondary" id="insert-beside" disabled>Вставить рядом</button>
      <button class="button primary" id="insert-replace" disabled>Заменить</button>
    </div>
  </footer>
</main>
